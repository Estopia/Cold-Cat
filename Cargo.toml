[workspace]
members = [
    "crates/coldcat-core",
    "crates/coldcat-platform",
    "crates/coldcat-daemon",
    "crates/coldcat-cli",
    "crates/coldcat-gui",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Djalanmixer/Cold-Cat"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
eframe = "0.29"
hmac = "0.12"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.29"
tempfile = "3.14"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
windows-service = "0.8"
